<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — Damye</title>
<meta name="description" content="Discover authentic local Korean restaurants curated by DAMYE — beyond tourist spots and viral trends.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="account">
<header id="site-header"></header>
<main>
<div class="container page-pad">
  <form class="panel" id="signup-form" novalidate>
    <h1 class="panel-title">Sign up</h1>
    <div id="setup"></div>
    <div class="notice notice-error" id="err" hidden></div>
    <div class="field"><label for="s-name">Name<span class="req">*</span></label><input class="input" id="s-name" required autocomplete="name"></div>
    <div class="field"><label for="s-email">Email<span class="req">*</span></label><input class="input" id="s-email" type="email" required autocomplete="email"></div>
    <div class="field"><label for="s-pass">Password<span class="req">*</span></label><input class="input" id="s-pass" type="password" required minlength="6" autocomplete="new-password"></div>
    <button class="btn btn-block" type="submit" id="s-btn" style="margin-top:18px">Sign up</button>
    <div class="or-divider"><span>or</span></div>
    <button type="button" class="btn-google" id="google-btn"><svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FBBC05" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#EA4335" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#34A853" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#4285F4" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>Continue with Google</button>
    <p class="auth-foot"><a id="login-link" href="login.html">Already have an account? <span>Login</span></a></p>
  </form>
</div>
</main>
<footer id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/restaurants.js"></script>
<script src="assets/js/site.js"></script>
<script>
window.DamyeAuthMsg = function (e) {
  var m = {
    "auth/invalid-credential": "Email or password is incorrect.",
    "auth/wrong-password": "Email or password is incorrect.",
    "auth/user-not-found": "Email or password is incorrect.",
    "auth/invalid-email": "Please enter a valid email address.",
    "auth/email-already-in-use": "An account with this email already exists. Try logging in.",
    "auth/weak-password": "Please use a password with at least 6 characters.",
    "auth/too-many-requests": "Too many attempts. Please wait a moment and try again.",
    "auth/requires-recent-login": "For your security, please log out and log in again, then try once more.",
    "auth/network-request-failed": "Network error. Check your connection and try again.",
    "auth/popup-blocked": "Your browser blocked the Google window. Allow pop-ups for this site and try again.",
    "auth/unauthorized-domain": "Google login isn’t allowed on this web address yet. Add it in Firebase → Authentication → Settings → Authorized domains.",
    "auth/operation-not-allowed": "This login method isn’t turned on in Firebase yet.",
    "auth/account-exists-with-different-credential": "This email already has a Damye account. Log in with your email and password."
  };
  return m[e && e.code] || "Something went wrong. Please try again.";
};
// Google login (used on Login and Sign up). Creates the profile on first sign-in.
window.DamyeGoogle = function (btn, done, fail) {
  var D = Damye;
  var provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  btn.disabled = true;
  D.auth.signInWithPopup(provider).then(function (res) {
    var u = res.user, ref = D.userDoc(u.uid);
    return ref.get().then(function (s) {
      if (s.exists) return;
      return ref.set({
        name: u.displayName || "", email: u.email || "", gender: "", age: "", nationality: "",
        photo: u.photoURL || "", favorites: [], createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    });
  }).then(done).catch(function (e) {
    btn.disabled = false;
    if (e && (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request")) return fail(null);
    fail(e);
  });
};
window.DamyeNotSetUp = '<div class="notice notice-info">Accounts aren’t connected yet. Add your Firebase settings in <b>assets/js/config.js</b>.</div>';
</script>

<script>
(function () {
  var D = Damye;
  var next = D.safeNext(D.param("next"), "profile.html");
  document.getElementById("login-link").href = "login.html?next=" + encodeURIComponent(next);
  var err = document.getElementById("err");
  function fail(msg) { err.textContent = msg; err.hidden = false; }
  if (!D.accountsOn) { document.getElementById("setup").innerHTML = DamyeNotSetUp; return; }
  var submitting = false;
  D.onUser(function (u) { if (u && !submitting) location.replace(next); });

  document.getElementById("google-btn").addEventListener("click", function () {
    err.hidden = true; submitting = true;
    DamyeGoogle(this, function () { location.replace(next); },
      function (e) { submitting = false; if (e) fail(DamyeAuthMsg(e)); });
  });

  document.getElementById("signup-form").addEventListener("submit", function (e) {
    e.preventDefault(); err.hidden = true;
    var name = document.getElementById("s-name").value.trim();
    var email = document.getElementById("s-email").value.trim();
    var pass = document.getElementById("s-pass").value;
    if (!name || !email || !pass) return fail("Please fill in every field.");
    if (pass.length < 6) return fail("Please use a password with at least 6 characters.");
    submitting = true;
    var btn = document.getElementById("s-btn"); btn.disabled = true;
    D.auth.createUserWithEmailAndPassword(email, pass).then(function (cred) {
      return D.userDoc(cred.user.uid).set({
        name: name, email: email, gender: "", age: "", nationality: "", photo: "",
        favorites: [], createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }).then(function () { location.replace(next); })
      .catch(function (e) { submitting = false; btn.disabled = false; fail(DamyeAuthMsg(e)); });
  });
})();
</script>
</body>
</html>
