<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurants — Damye</title>
<meta name="description" content="Discover authentic local Korean restaurants curated by DAMYE — beyond tourist spots and viral trends.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="restaurants">
<header id="site-header"></header>
<main>
<div class="container list-page">
  <form class="search-box" role="search" id="search-form">
    <span data-icon="search"></span>
    <label class="sr-only" for="q">Search for restaurants</label>
    <input id="q" type="search" placeholder="Search for restaurants ..." autocomplete="off">
  </form>
  <div class="chips" id="chips"></div>
  <div class="card-grid" id="grid"></div>
</div>
</main>
<footer id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/restaurants.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  var D = Damye;
  var selected = [];
  var animal = D.param("animal"), filter = D.param("filter");
  if (animal && D.ANIMAL_FILTERS[animal]) selected = D.ANIMAL_FILTERS[animal].slice();
  else if (filter && D.filterByKey(filter)) selected = [filter];
  var q = document.getElementById("q");
  q.value = D.param("q") || "";

  function renderChips() {
    var html = D.FILTERS.map(function (f) {
      var on = selected.indexOf(f.key) > -1;
      return '<button type="button" class="chip' + (on ? " on" : "") + '" data-key="' + f.key + '" aria-pressed="' + on + '">' + D.icon(f.icon) + D.esc(f.label) + '</button>';
    }).join("");
    html += '<button type="button" class="chip chip-reset" data-reset="1">' + D.icon("reset") + 'Reset</button>';
    document.getElementById("chips").innerHTML = html;
  }

  function render() {
    var term = q.value.trim().toLowerCase();
    var list = D.restaurants.filter(function (r) {
      if (!term) return true;
      return [r.nameKo, r.nameEn, r.desc, r.cuisine, r.address].join(" ").toLowerCase().indexOf(term) > -1;
    });
    if (selected.length) {
      // Show places matching any selected filter; best matches first.
      list = list.map(function (r) {
        var n = (r.tags || []).filter(function (t) { return selected.indexOf(t) > -1; }).length;
        return { r: r, n: n };
      }).filter(function (x) { return x.n > 0; })
        .sort(function (a, b) { return b.n - a.n; })
        .map(function (x) { return x.r; });
    }
    document.getElementById("grid").innerHTML = list.length
      ? list.map(D.cardHTML).join("")
      : '<p class="empty">No restaurants match yet. Try another filter or search.</p>';
    D.refreshHearts();
  }

  document.getElementById("chips").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.reset) { selected = []; q.value = ""; }
    else {
      var k = b.dataset.key, i = selected.indexOf(k);
      if (i > -1) selected.splice(i, 1); else selected.push(k);
    }
    renderChips(); render();
  });
  q.addEventListener("input", render);
  document.getElementById("search-form").addEventListener("submit", function (e) { e.preventDefault(); render(); });

  renderChips(); render();

  // Arriving from a category, quiz result or search: start at the very top
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  window.scrollTo(0, 0);
  window.addEventListener("load", function () { window.scrollTo(0, 0); });
})();
</script>
</body>
</html>
